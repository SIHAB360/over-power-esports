plugins {
 id 'com.android.application'
}
def signFile = System.getenv('OP_ANDROID_KEYSTORE_PATH')
def signPass = System.getenv('OP_ANDROID_STORE_PASSWORD')
def signAlias = System.getenv('OP_ANDROID_KEY_ALIAS')
def signKeyPass = System.getenv('OP_ANDROID_KEY_PASSWORD')
def canReleaseSign = [signFile,signPass,signAlias,signKeyPass].every{it!=null&&!it.isEmpty()}

def firebaseConfig = { key -> (System.getenv(key) ?: '').replaceAll('[^A-Za-z0-9_:\\-]', '') }
android {
 buildFeatures { buildConfig true }
 namespace 'com.overpower.esports'
 compileSdk 36
 defaultConfig {
  applicationId 'com.overpower.esports'
  minSdk 26
  targetSdk 35
  versionCode 2
  versionName '2.1.0'
  buildConfigField 'String','FCM_API_KEY','"'+firebaseConfig('OP_FIREBASE_API_KEY')+'"'
  buildConfigField 'String','FCM_APP_ID','"'+firebaseConfig('OP_FIREBASE_APP_ID')+'"'
  buildConfigField 'String','FCM_SENDER_ID','"'+firebaseConfig('OP_FIREBASE_SENDER_ID')+'"'
  buildConfigField 'String','FCM_PROJECT_ID','"'+firebaseConfig('OP_FIREBASE_PROJECT_ID')+'"'
 }
 signingConfigs {
  if(canReleaseSign) {
   release {
    storeFile file(signFile)
    storePassword signPass
    keyAlias signAlias
    keyPassword signKeyPass
   }
  }
 }
 buildTypes {
  debug {
   applicationIdSuffix '.v2test'
   versionNameSuffix '-test'
  }
  release {
   minifyEnabled false
   if(canReleaseSign)signingConfig signingConfigs.release
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}

dependencies {
 implementation 'com.google.firebase:firebase-messaging:24.1.2'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.core:core:1.15.0'
}
