plugins {
    id 'com.android.application'
}

// Keep all release signing keys OUT of the repository.
// Provide these optional variables locally or via GitHub encrypted secrets.
def signFile = System.getenv('OP_ANDROID_KEYSTORE_PATH')
def signPass = System.getenv('OP_ANDROID_STORE_PASSWORD')
def signAlias = System.getenv('OP_ANDROID_KEY_ALIAS')
def signKeyPass = System.getenv('OP_ANDROID_KEY_PASSWORD')
def canReleaseSign = [signFile, signPass, signAlias, signKeyPass].every { it != null && !it.isEmpty() }

android {
    namespace 'com.overpower.esports'
    compileSdk 36

    defaultConfig {
        applicationId 'com.overpower.esports'
        minSdk 26
        targetSdk 35
        versionCode 4
        resValue 'string','op_firebase_app_id',(System.getenv('OP_FIREBASE_APP_ID') ?: '')
        resValue 'string','op_firebase_api_key',(System.getenv('OP_FIREBASE_API_KEY') ?: '')
        resValue 'string','op_firebase_project_id',(System.getenv('OP_FIREBASE_PROJECT_ID') ?: '')
        resValue 'string','op_firebase_sender_id',(System.getenv('OP_FIREBASE_SENDER_ID') ?: '')
        // FirebaseInitProvider reads these standard Android resources during
        // cold-start push delivery when MainActivity is NOT running.
        resValue 'string','google_app_id',(System.getenv('OP_FIREBASE_APP_ID') ?: '')
        resValue 'string','google_api_key',(System.getenv('OP_FIREBASE_API_KEY') ?: '')
        resValue 'string','gcm_defaultSenderId',(System.getenv('OP_FIREBASE_SENDER_ID') ?: '')
        resValue 'string','project_id',(System.getenv('OP_FIREBASE_PROJECT_ID') ?: '')
        versionName '1.3.0'
    }

    signingConfigs {
        if (canReleaseSign) {
            release {
                storeFile file(signFile)
                storePassword signPass
                keyAlias signAlias
                keyPassword signKeyPass
            }
        }
    }

    buildTypes {
        debug {
            // Debug APK uses its own app ID, so test installs do not replace
            // the eventual Play Store / signed release app.
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            if (canReleaseSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
}
