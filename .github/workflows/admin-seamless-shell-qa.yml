name: Admin seamless desktop and mobile shell

on:
  push:
    branches:
      - feat/admin-seamless-scroll-inset-20261020
    paths:
      - app/admin/**
      - tests/admin/seamless-shell-smoke.cjs
      - .github/workflows/admin-seamless-shell-qa.yml
  pull_request:
    branches: [main]
    paths:
      - app/admin/**
      - tests/admin/seamless-shell-smoke.cjs
      - .github/workflows/admin-seamless-shell-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-seamless-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://op-ui-qa.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-client-only
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated UI test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Build with synthetic public credentials only
        run: npm run build
      - name: Run local Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3156 >"$RUNNER_TEMP/admin-shell.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/admin-shell.pid"
          for i in $(seq 1 75); do
            if curl --max-time 2 -fsS -o /dev/null http://127.0.0.1:3156/login; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/admin-shell.log"
          exit 1
      - name: Test fixed sidebar, right-only scrolling, active inset and mobile
        run: node tests/admin/seamless-shell-smoke.cjs
      - name: Remove disposable server state
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/admin-shell.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/admin-shell.pid")" || true
          fi
