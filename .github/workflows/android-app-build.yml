name: Android App — Native Fullscreen Test APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app-build.yml"
      - "public/manifest.webmanifest"
      - "public/match-notifications-sw.js"
      - "app/pwa-icon/**"
      - "app/.well-known/**"
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-app-build.yml"
permissions:
  contents: read
jobs:
  debug-apk:
    name: Build Native Android Fullscreen Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 36 from GitHub hosted runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Firebase-enabled APK when project config is connected
        run: echo "Firebase public project identifiers are optional at build; FCM is inactive without them."
      - name: Compile unsigned-release-free debug APK
        working-directory: android
        env:
          OP_FIREBASE_API_KEY: ${{ secrets.OP_FIREBASE_API_KEY }}
          OP_FIREBASE_APP_ID: ${{ secrets.OP_FIREBASE_APP_ID }}
          OP_FIREBASE_SENDER_ID: ${{ secrets.OP_FIREBASE_SENDER_ID }}
          OP_FIREBASE_PROJECT_ID: ${{ secrets.OP_FIREBASE_PROJECT_ID }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload test APK (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: over-power-esports-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
