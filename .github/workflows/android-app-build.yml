name: Android App — Test APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app-build.yml"
      - "public/manifest.webmanifest"
      - "public/match-notifications-sw.js"
      - "app/pwa-icon/**"
      - "app/.well-known/**"
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-app-build.yml"
permissions:
  contents: read
jobs:
  debug-apk:
    name: Build Native Android Software APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 36 from GitHub hosted runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Use official site logo for Android home-screen icon
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python android/scripts/prepare_brand_icons.py
      - name: Compile unsigned-release-free debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK package and native launcher
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.overpower.esports.debug'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "launchable-activity: name='com.overpower.esports.MainActivity'"
          unzip -l "$APK" | grep 'res/mipmap'
      - name: Upload test APK (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: over-power-esports-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
