name: Android App — Signed Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      OP_FIREBASE_APP_ID: ${{ secrets.OP_RELEASE_FIREBASE_APP_ID }}
      OP_FIREBASE_API_KEY: ${{ secrets.OP_FIREBASE_API_KEY }}
      OP_FIREBASE_PROJECT_ID: ${{ secrets.OP_FIREBASE_PROJECT_ID }}
      OP_FIREBASE_SENDER_ID: ${{ secrets.OP_FIREBASE_SENDER_ID }}
      OP_ANDROID_STORE_PASSWORD: ${{ secrets.OP_ANDROID_STORE_PASSWORD }}
      OP_ANDROID_KEY_ALIAS: ${{ secrets.OP_ANDROID_KEY_ALIAS }}
      OP_ANDROID_KEY_PASSWORD: ${{ secrets.OP_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate required release secrets
        env:
          KEYSTORE_B64: ${{ secrets.OP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_B64 OP_ANDROID_STORE_PASSWORD OP_ANDROID_KEY_ALIAS OP_ANDROID_KEY_PASSWORD OP_FIREBASE_APP_ID OP_FIREBASE_API_KEY OP_FIREBASE_PROJECT_ID OP_FIREBASE_SENDER_ID; do
            test -n "${!key}" || { echo "::error::Missing required release configuration: $key"; exit 1; }
          done
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare signing file
        env:
          KEYSTORE_B64: ${{ secrets.OP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/overpower-release.jks"
          echo "OP_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/overpower-release.jks" >> "$GITHUB_ENV"
      - name: Prepare branded icon
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python android/scripts/prepare_brand_icons.py
      - name: Build signed release
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify release identity and signing
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.overpower.esports'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: over-power-esports-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
